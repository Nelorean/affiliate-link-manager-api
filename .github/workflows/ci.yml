name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: affiliate_user
          POSTGRES_PASSWORD: affiliate_password
          POSTGRES_DB: affiliate_links_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliate_user -d affiliate_links_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://affiliate_user:affiliate_password@localhost:5432/affiliate_links_test
      JWT_SECRET: ci_test_secret

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Aplicar migrations
        run: npx prisma migrate deploy

      - name: Verificar lint
        run: npm run lint

      - name: Verificar formatação
        run: npm run format:check

      - name: Executar testes
        run: npm test