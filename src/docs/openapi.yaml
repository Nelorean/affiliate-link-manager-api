paths:
  /health:
    get:
      summary: Verifica o status da API
      tags:
        - Health
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      summary: Cadastra um novo usuário
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - confirmPassword
              properties:
                name:
                  type: string
                  example: João Silva
                email:
                  type: string
                  format: email
                  example: usuario@email.com
                phone:
                  type: string
                  example: '11999999999'
                password:
                  type: string
                  format: password
                  example: Senha@123
                confirmPassword:
                  type: string
                  format: password
                  example: Senha@123
      responses:
        '201':
          description: Usuário cadastrado com sucesso
        '400':
          description: Dados de cadastro inválidos
        '409':
          description: E-mail já cadastrado
/auth/login:
  post:
    summary: Autentica um usuário
    tags:
      - Auth
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - email
              - password
            properties:
              email:
                type: string
                format: email
                example: usuario@email.com
              password:
                type: string
                format: password
                example: Senha@123
    responses:
      '200':
        description: Login realizado com sucesso
      '400':
        description: Dados de login inválidos
      '401':
        description: E-mail ou senha inválidos
/auth/me:
  get:
    summary: Retorna os dados do usuário autenticado
    tags:
      - Auth
    security:
      - bearerAuth: []
    responses:
      '200':
        description: Dados do usuário autenticado
      '401':
        description: Token ausente, inválido ou expirado
      '404':
        description: Usuário não encontrado
/links:
  post:
    summary: Cria um novo link
    tags:
      - Links
    security:
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
              - originalUrl
              - slug
            properties:
              title:
                type: string
                example: Curso Node.js
              originalUrl:
                type: string
                format: uri
                example: https://example.com/produto
              slug:
                type: string
                example: curso-node
              campaign:
                type: string
                example: black-friday
              notes:
                type: string
                example: Link usado na campanha principal
              expiresAt:
                type: string
                format: date-time
                nullable: true
                example: '2026-12-31T23:59:59.000Z'
    responses:
      '201':
        description: Link criado com sucesso
      '400':
        description: Dados do link inválidos
      '401':
        description: Token ausente, inválido ou expirado
      '409':
        description: Slug já está em uso
  get:
    summary: Lista os links do usuário autenticado
    tags:
      - Links
    security:
      - bearerAuth: []
    parameters:
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Número da página
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Quantidade de links por página
      - in: query
        name: campaign
        schema:
          type: string
        description: Filtra links pela campanha
      - in: query
        name: search
        schema:
          type: string
        description: Busca pelo título ou slug
      - in: query
        name: isActive
        schema:
          type: boolean
        description: Filtra links ativos ou inativos
    responses:
      '200':
        description: Lista de links retornada com sucesso
      '400':
        description: Filtros ou paginação inválidos
      '401':
        description: Token ausente, inválido ou expirado
/links/{id}:
  get:
    summary: Busca um link pelo ID
    tags:
      - Links
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: ID do link
    responses:
      '200':
        description: Link encontrado
      '401':
        description: Token ausente, inválido ou expirado
      '404':
        description: Link não encontrado
  patch:
    summary: Atualiza um link
    tags:
      - Links
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: ID do link
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title:
                type: string
                example: Curso Node.js atualizado
              originalUrl:
                type: string
                format: uri
                example: https://example.com/novo-produto
              slug:
                type: string
                example: curso-node-atualizado
              campaign:
                type: string
                example: campanha-2026
              notes:
                type: string
                example: Observação atualizada
              expiresAt:
                type: string
                format: date-time
                nullable: true
              isActive:
                type: boolean
                example: true
    responses:
      '200':
        description: Link atualizado com sucesso
      '400':
        description: Dados de atualização inválidos
      '401':
        description: Token ausente, inválido ou expirado
      '404':
        description: Link não encontrado
      '409':
        description: Slug já está em uso
  delete:
    summary: Desativa um link
    tags:
      - Links
    security:
      - bearerAuth: []
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: ID do link
    responses:
      '200':
        description: Link desativado com sucesso
      '401':
        description: Token ausente, inválido ou expirado
      '404':
        description: Link não encontrado
/r/{slug}:
  get:
    summary: Redireciona para a URL original
    tags:
      - Redirect
    parameters:
      - in: path
        name: slug
        required: true
        schema:
          type: string
        description: Slug público do link
    responses:
      '302':
        description: Redirecionamento para a URL original
      '404':
        description: Link não encontrado
      '410':
        description: Link inativo ou expirado
