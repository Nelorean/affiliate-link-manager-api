services:
  postgres:
    image: postgres:16
    container_name: affiliate_link_manager_db
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: affiliate_user
      POSTGRES_PASSWORD: affiliate_password
      POSTGRES_DB: affiliate_links
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affiliate_user -d affiliate_links']
      interval: 5s
      timeout: 5s
      retries: 5 
  api:
    build: .
    container_name: affiliate_link_manager_api
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://affiliate_user:affiliate_password@postgres:5432/affiliate_links
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
